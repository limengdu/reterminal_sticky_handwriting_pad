[platformio]
default_envs = sticky-release

[env]
platform = espressif32@6.11.0
board = sticky_esp32s3
framework = espidf
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
board_build.partitions = partitions.csv

build_flags =
    -DSTICKY_FIRMWARE_VERSION=\"0.1.0\"

[env:sticky-release]
build_type = release
build_flags =
    ${env.build_flags}
    -DSTICKY_LOG_COMPILE_LEVEL=3

[env:sticky-debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DSTICKY_LOG_COMPILE_LEVEL=4
    -DSTICKY_LOG_TOUCH_DRIVER_OUTPUT_ENABLED=1
